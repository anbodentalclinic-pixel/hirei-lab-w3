.choices{display:grid;gap:10px}.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}

.ansline{font-size:18px;background:#FFF4E8;color:#1E1B3A}

svg.tapgrid{cursor:crosshair;touch-action:manipulation}
.kw.k3 i{background:#2E7D3E}.kwt.k3{background:#2E7D3E}
.scenebox{border:2px solid var(--line);background:var(--chip);margin-bottom:8px}.scenebox.small svg{max-height:110px}
.scene{display:block;width:100%;height:auto;aspect-ratio:300/170;margin:0 auto}
.scene .st{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700}
@keyframes scAp{0%{opacity:0}12%,88%{opacity:1}100%{opacity:1}}
.scene .ap{opacity:0;animation:scAp 4s ease-out infinite}
@keyframes scAp2{0%,70%{opacity:0}80%,100%{opacity:1}}
.scene .ap2{animation:scAp2 4s infinite}
@keyframes scSpin{to{transform:rotate(360deg)}}
.scene .spin{transform-box:fill-box;transform-origin:center;animation:scSpin linear infinite}.scene .spin.rev{animation-direction:reverse}
@keyframes scRise{0%{transform:scaleY(.04)}85%,100%{transform:scaleY(.82)}}
.scene .rise{transform-box:fill-box;transform-origin:bottom;animation:scRise 6s steps(9,end) infinite}
@keyframes scFlow{50%{opacity:.4}}.scene .flow{animation:scFlow .6s infinite}
@keyframes scShrink{0%,30%{transform:scaleX(1)}60%,100%{transform:scaleX(.83)}}
.scene .shrink{transform-box:fill-box;transform-origin:left;animation:scShrink 4s infinite}
@keyframes scGlow{50%{opacity:.6}}.scene .glow{animation:scGlow 1.2s infinite}
@keyframes scRide{0%{transform:translateX(0)}80%,100%{transform:translateX(230px)}}
.scene .ride{animation:scRide 6s steps(4,end) infinite}

.scene .cyc{opacity:0;animation:scCyc 6s infinite}
@media (prefers-reduced-motion: reduce){.scene *{animation:none!important;opacity:1!important}.scene .cyc{opacity:0!important}.scene .cyc:first-of-type{opacity:1!important}}

<body>
<div class="wrap"><main id="app" aria-live="polite"></main></div>
<div class="ground" aria-hidden="true"></div>
<script>
(function(){
/* ====== 進捗記録の設定(GitHub Pages で使うとき) ======
   Google Apps Script の「ウェブアプリURL」と、合言葉を入れてください。
   空のままなら記録は送られません。 */
var LOG_URL = '';
var LOG_KEY = '';
/* ================================================ */
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var KEY='hireiLabW3';
function load(){try{var v=localStorage.getItem(KEY);if(v)return JSON.parse(v);}catch(e){}return null;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
var save=load()||{};
save.stars=save.stars||{}; save.coins=save.coins||0; save.miss=save.miss||{swap:0,sign:0,calc:0};
if(save.sound===undefined)save.sound=true;
save.queue=save.queue||[];
save.device=save.device||Math.random().toString(36).slice(2,8);

/* ---------- progress log ---------- */
function calcStars(){var n=G.st.n,f=G.firstOK;return G.over?0:(f===n?3:(f>=n-2?2:1));}
function logResult(result){
  if(!LOG_URL||!G)return;
  var answered=Math.min(G.st.n,G.i+(G.done?1:0)+(result==='ゲームオーバー'?1:0));
  save.queue.push({
    key:LOG_KEY, app:'比例ラボ 第3週', stage:G.st.name, result:result,
    answered:answered, total:G.st.n, firstOK:G.firstOK, stars:result==='途中でやめた'?0:calcStars(),
    swap:G.ms.swap, sign:G.ms.sign, calc:G.ms.calc,
    seconds:Math.round((Date.now()-G.t0)/1000), device:save.device,
    clientTime:new Date().toLocaleString('ja-JP')
  });
  if(save.queue.length>100)save.queue=save.queue.slice(-100);
  persist(); flush();
}
var flushing=false;
function flush(){
  if(!LOG_URL||flushing||!save.queue.length||!window.fetch)return;
  flushing=true;
  fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(save.queue[0])})
    .then(function(){save.queue.shift();persist();flushing=false;flush();})
    .catch(function(){flushing=false;});
}
window.addEventListener('online',flush);

/* ---------- sound (8bit, Web Audio) ---------- */
var actx=null;
function ac(){
  if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{actx=new C();}catch(e){return null;}}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function tone(f,st,dur,type,vol,to){
  if(!save.sound)return;var c=ac();if(!c)return;
  var t=c.currentTime+st,o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol||0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.03);
}
var SFX={
  tap:function(){tone(660,0,0.05,'square',0.035);},
  place:function(){tone(523,0,0.07,'square',0.06);tone(784,0.06,0.07,'square',0.05);},
  step:function(){tone(784,0,0.08);tone(1175,0.08,0.14);},
  coin:function(){tone(988,0,0.07,'square',0.07);tone(1319,0.07,0.3,'square',0.07);},
  wrong:function(){tone(196,0,0.12,'square',0.07);tone(147,0.12,0.25,'square',0.07);},
  heart:function(){tone(440,0.05,0.35,'sawtooth',0.05,110);},
  jumps:function(n,gap){for(var i=0;i<n;i++)tone(320,i*gap,0.12,'square',0.04,760);},
  start:function(){[523,659,784].forEach(function(f,i){tone(f,i*0.07,0.09,'square',0.06);});},
  clear:function(){[523,659,784,1047,0,784,1047].forEach(function(f,i){if(f)tone(f,i*0.11,0.15,'square',0.07);});tone(1568,0.8,0.5,'square',0.06);},
  over:function(){[392,330,262,196].forEach(function(f,i){tone(f,i*0.2,0.24,'triangle',0.1);});}
};
function soundBtn(compact){
  var on=save.sound;
  return '<button class="btn plain snd" data-act="sound" aria-pressed="'+on+'" aria-label="効果音 '+(on?'オン':'オフ')+'">'
   +'<svg width="22" height="20" viewBox="0 0 11 10" aria-hidden="true"><path d="M0 3h2l3-3h1v10H5L2 7H0z" fill="currentColor"/>'
   +(on?'<path d="M7 3v1h1v2H7v1h1V6h1V4H8V3zM9 1v1h1v6H9v1h1V8h1V2h-1V1z" fill="currentColor"/>':'<path d="M7 3l4 4M11 3l-4 4" stroke="currentColor" stroke-width="1.2"/>')
   +'</svg>'+(compact?'':'<span>'+(on?'音 ON':'音 OFF')+'</span>')+'</button>';
}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function sgn(){return Math.random()<.5?-1:1;}
function M(n){return n<0?'−'+Math.abs(n):String(n);}
function P(n){return n<0?'('+M(n)+')':M(n);}
function frac(n,d){if(d===1)return M(n);return (n<0?'−':'')+'<span class="fr"><span>'+Math.abs(n)+'</span><span>'+d+'</span></span>';}
function eqn(n,d){if(d===1&&n===1)return 'y = x';if(d===1&&n===-1)return 'y = −x';return 'y = '+frac(n,d)+'x';}

var STAGES=[
  {id:'meet',name:'反比例ってなに?',desc:'あめ・長方形・ひもで「かけると同じ」を見つけよう',n:3},
  {id:'shiki',name:'反比例の式',desc:'形→代入→かっこ→符号→計算→たしかめ',n:6},
  {id:'graph',name:'反比例のグラフ',desc:'点を打って曲線を作ろう/グラフから式',n:6},
  {id:'quest',name:'文章題クエスト',desc:'5ステップで「答えの文」までクリア',n:5},
  {id:'boss',name:'ボス戦',desc:'全部まぜて8問。ハートは3つ',n:8}
];
var GR=6,C=150,U=21;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fracH(n,d){return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';}

var AVALS=[6,8,12,18,20,24,30];
function divisors(a){var d=[];for(var i=1;i<=Math.abs(a);i++)if(a%i===0)d.push(i);return d;}
function genFind(){var a,x,y;do{a=AVALS[rnd(0,AVALS.length-1)]*sgn();var ds=divisors(a).filter(function(v){return v<=6;});x=ds[rnd(0,ds.length-1)]*sgn();y=a/x;}while(Math.abs(x)===Math.abs(y));return {type:'find',a:a,x:x,y:y,flip:Math.random()<.5};}
function genTable(){var a=[6,12,24][rnd(0,2)]*sgn();var xs=[-6,-3,-2,-1,1,2,3,6].filter(function(v){return a%v===0;}),ask;do{ask=xs[rnd(0,xs.length-1)];}while(Math.abs(ask)===1);return {type:'table',a:a,xs:[-3,-2,-1,1,2,3],ask:ask,y:a/ask};}
function fixTable(q){if(q.xs.indexOf(q.ask)<0){q.xs=[-6,-3,-2,2,3,6];}return q;}
var GAS=[4,6,8,12];
function genGraph(t){return {type:t,a:GAS[rnd(0,GAS.length-1)]*sgn()};}
function genQ(t,used){
  if(t==='meet'){return {type:'meet',m:MEET[used.meet++%MEET.length]};}
  if(t==='table')return fixTable(genTable());
  if(t==='find')return genFind();
  if(t==='gdraw'||t==='gread')return genGraph(t);
  if(t==='quest'){var p=used.qpool.shift();return {type:'quest',p:p,askOrder:shuffle([0,1,2]),pairs:shuffle([0,1]),wo:shuffle([p.w].concat(p.wo)),nums:shuffle([p.ans,p.kv,p.c].filter(function(v,i,arr){return arr.indexOf(v)===i;})),units:shuffle(p.units)};}
}

function startStage(id){
  var st=STAGES.filter(function(s){return s.id===id;})[0],qs=[],used={meet:0,qpool:shuffle(QUEST)};
  var plan={meet:['meet','meet','meet'],shiki:shuffle(['table','table','find','find','find','find']),graph:['gdraw','gdraw','gdraw','gread','gread','gread'],quest:['quest','quest','quest','quest','quest'],boss:shuffle(['find','find','table','gread','gdraw','quest','quest','find'])}[id];
  plan.forEach(function(t){qs.push(genQ(t,used));});
  G={st:st,qs:qs,i:0,firstOK:0,hearts:id==='boss'?3:null,over:false,ms:{swap:0,sign:0,calc:0,word:0},t0:Date.now()};
  resetQ(); screen='play'; render(); SFX.start();
}
function resetQ(){
  var q=G.qs[G.i];
  G.phase={meet:'try',table:'num',find:'form',gdraw:'pts',gread:'tap',quest:'s0'}[q.type];
  G.input='';G.neg=false;G.boxes=[null,null];G.parenDone=false;G.sign=null;G.mark=null;G.pt=null;G.pts=[];
  G.tried=[];G.rows={div:false,mul:false};G.qn=null;G.qu=null;
  G.missed=false;G.done=false;G.fb=null;
}
function miss(kind,msg){
  var q=G.qs[G.i];
  if(kind!=='word')msg=(['check','gcheck','s4t'].indexOf(G.phase)>=0?'<span class="kwt k3">合言葉③ もとに戻して たしかめる</span>':'<span class="kwt">合言葉① 1行に1ステップ</span>')+'<br>'+msg;
  else if(q.type==='quest')msg='<span class="kwt k2">合言葉② 答えの文まで</span><br>'+msg;
  save.miss[kind]=(save.miss[kind]||0)+1; G.ms[kind]++; G.missed=true; G.fb={ok:false,msg:msg};
  if(G.hearts!==null){G.hearts--; if(G.hearts<=0){G.over=true; persist(); logResult('ゲームオーバー'); screen='result'; render(); SFX.over(); return true;} SFX.wrong(); SFX.heart();}
  else SFX.wrong();
  persist(); return false;
}
function finish(msg){
  G.done=true; G.phase='done';
  if(!G.missed){G.firstOK++;save.coins+=2;}else{save.coins+=1;}
  persist();
  G.fb={ok:true,msg:PRAISE[rnd(0,PRAISE.length-1)]+(msg?' '+msg:'')};
  render(); SFX.coin();
}
function step(msg){G.fb={ok:true,msg:msg};SFX.step();render();}

    return h+'<p class="ask" style="font-size:18px;margin-top:12px">表の中で、<b>いつも同じ</b>になるものは?</p><div class="choices two"><button class="btn small'+(G.rows.mul?' on':'')+'" data-act="trow" data-v="mul">x × y を<br>計算してみる</button><button class="btn small'+(G.rows.div?' on':'')+'" data-act="trow" data-v="div">y ÷ x を<br>計算してみる</button></div>'
      +'<div class="choices" style="margin-top:10px"><button class="btn small" data-act="wc" data-v="mul"'+(any?'':' disabled')+'>x × y がいつも同じ</button><button class="btn small" data-act="wc" data-v="div"'+(any?'':' disabled')+'>y ÷ x がいつも同じ</button></div>';
  }
  var opts=shuffle([['prop','y = '+m.c+'x'],['inv',invEq(m.c)],['add','y = x + '+m.c]]);
  if(!G.qn)G.qn=opts;
  h='<p class="ask" style="font-size:18px">x × y = '+m.c+' だから、y を x の式で表すと?</p><div class="choices">';
  G.qn.forEach(function(o){h+='<button class="btn" data-act="wc" data-v="'+o[0]+'">'+o[1]+'</button>';});
  return h+'</div>';
}
function onMeetX(x){
  if(G.done||(G.phase!=='try'&&G.phase!=='find'))return;
  if(G.tried.indexOf(x)<0)G.tried.push(x);else{G.tried.splice(G.tried.indexOf(x),1);G.tried.push(x);}
  SFX.place();G.fb=null;
  if(G.phase==='try'&&G.tried.length>=4){G.phase='find';G.fb={ok:true,msg:'表ができてきた! x が増えると y は? そして、<b>いつも同じ</b>になるものは?'};}
  render();
}
function onMeetChoice(v){
  var q=G.qs[G.i];
  if(G.phase==='find'){
    if(v==='mul'){G.phase='form';G.rows.mul=true;G.rows.div=true;step('そう! <b>x × y がいつも '+q.m.c+'</b>。比例(y ÷ x が同じ)とはちがう関係だね。');return;}
    if(miss('word','計算した行を見比べよう。<b>全部同じ数</b>になっているのはどっち?'))return;G.rows.mul=true;G.rows.div=true;render();return;
  }
  if(G.phase==='form'){
    if(v==='inv'){finish('これが <b>反比例</b>。y = a/x の a を<b>比例定数</b>という。');return;}
    if(miss('swap',v==='prop'?'y = '+q.m.c+'x は比例の式。x × y = '+q.m.c+' なら、y = '+q.m.c+' ÷ x。':'たし算の式ではないよ。x × y = '+q.m.c+' から y を求めると?'))return;render();
  }
}

function viewGraph(q){

  if(G.done)h+='<div class="nl fin">'+invEq(q.a)+'</div>';

}

  if(G.phase==='s4c')return '<p class="ask" style="font-size:17px">④ a はいくつ?(表の x と y から)</p>'+keypad3('OK');
  if(G.phase==='s4s')return '<p class="ask" style="font-size:17px">④ '+(p.known==='y'?'y = '+p.kv:'x = '+p.kv)+' を入れて、1行1ステップで解こう</p>'+keypad3('OK');
  if(G.phase==='s4t'){var qc=qcheck(p);return '<p class="ask" style="font-size:17px">⑤ もとに戻して たしかめよう(合言葉③)<br><span style="font-size:14px">'+qc.lead+' '+qc.expr+' は? '+qc.goal+' になる?</span></p>'+keypad3('OK');}
  var h2='<p class="ask" style="font-size:17px">⑥ 答えの文を完成させよう</p><p class="cap">数</p><div class="choices three">';
  q.nums.forEach(function(n){h2+='<button class="btn'+(G.qn===n?' on':'')+'" data-act="qn" data-v="'+n+'">'+n+'</button>';});
  h2+='</div><p class="cap">単位</p><div class="choices three">';q.units.forEach(function(u){h2+='<button class="btn'+(G.qu===u?' on':'')+'" data-act="qu" data-v="'+u+'">'+u+'</button>';});
  return h2+'</div><button class="btn blue wide" data-act="qdone" style="margin-top:12px"'+(G.qn!==null&&G.qu?'':' disabled')+'>答えの文 できた!</button>';
}
function fmtRatio(r){if(r>=1)return String(Math.round(r*100)/100);var d=Math.round(1/r);return Math.abs(1/d-r)<1e-9?fracH(1,d):String(r);}
function keypad3(lab,neg){
  var keys=['7','8','9','4','5','6','1','2','3',neg?'−':'','0','⌫'],h='<div class="keypad">';
  keys.forEach(function(k){if(!k){h+='<span></span>';return;}var on=(k==='−'&&G.neg)?' on':'';h+='<button class="btn'+on+'" data-act="key" data-v="'+k+'"'+(k==='⌫'?' aria-label="1文字けす"':'')+(k==='−'?' aria-label="マイナス切りかえ" aria-pressed="'+G.neg+'"':'')+'>'+k+'</button>';});
  return h+'<button class="btn ok" data-act="ok">'+lab+'</button></div>';
}
function controls(q){
  if(G.done)return '<button class="btn blue wide" data-act="next">'+(G.i+1>=G.st.n?'結果を見る':'次へ')+'</button>';
  if(q.type==='meet')return meetControls(q);
  if(q.type==='quest')return questControls(q);
  if(q.type==='table')return keypad3('OK',true);
  if(q.type==='find'){
    if(G.phase==='form'){if(!G.qn)G.qn=shuffle([['ax','y = ax'],['adx','y = '+fracH('a','x')],['xa','y = '+fracH('x','a')]]);var h='<p class="ask" style="font-size:18px">反比例の式の形はどれ?</p><div class="choices">';G.qn.forEach(function(o){h+='<button class="btn" data-act="wc" data-v="'+o[0]+'">'+o[1]+'</button>';});return h+'</div>';}
    if(G.phase==='place'){var ks=q.flip?['x','y']:['y','x'],h2='<div class="chips">';ks.forEach(function(k){var used=G.boxes.indexOf(k)>=0;h2+='<button class="btn" data-act="chip" data-k="'+k+'"'+(used?' disabled':'')+'>'+M(k==='x'?q.x:q.y)+'</button>';});return h2+'</div><p class="cap">数字をタップすると□に入るよ</p>';}
    if(G.phase==='paren')return '<p class="ask" style="font-size:18px">マイナスの数が入ったね。どう書く?</p><div class="signs"><button class="btn" data-act="paren" data-v="wrap">( ) をつける</button><button class="btn plain" data-act="paren" data-v="skip">このままでOK</button></div>';
    if(G.phase==='sign')return '<p class="ask" style="font-size:18px">a はプラス? マイナス?</p><div class="signs"><button class="btn" data-act="sign" data-v="1">+ プラス</button><button class="btn" data-act="sign" data-v="-1">− マイナス</button></div>';
    if(G.phase==='num')return keypad3('OK');
    return '<p class="ask" style="font-size:18px">たしかめ算: a ÷ x が y になるかな?</p>'+keypad3('OK',true);
  }
  if(q.type==='gdraw'){
    if(G.phase==='pts')return '<button class="btn wide" data-act="place"'+(G.mark?'':' disabled')+'>ここに点を打つ</button><p class="cap">x × y = '+M(q.a)+' になる交点をタップ</p>';
    if(G.phase==='f1')return '<p class="ask" style="font-size:18px">反比例のグラフの名前は?</p><div class="choices three"><button class="btn small" data-act="wc" data-v="hyp">双曲線</button><button class="btn small" data-act="wc" data-v="line">直線</button><button class="btn small" data-act="wc" data-v="para">放物線</button></div>';
    return '<p class="ask" style="font-size:18px">このグラフは原点を通る?</p><div class="choices two"><button class="btn small" data-act="wc" data-v="yes">通る</button><button class="btn small" data-act="wc" data-v="no">通らない</button></div>';
  }
  if(G.phase==='tap')return '<button class="btn wide" data-act="place"'+(G.mark?'':' disabled')+'>ここに決定</button><p class="cap">曲線がマス目の交点を通るところをタップ</p>';
  if(G.phase==='sign')return '<p class="ask" style="font-size:18px">a はプラス? マイナス?</p><div class="signs"><button class="btn" data-act="sign" data-v="1">+ プラス</button><button class="btn" data-act="sign" data-v="-1">− マイナス</button></div>';
  if(G.phase==='gcheck')return '<p class="ask" style="font-size:18px">たしかめ算:a ÷ x が、点の y になるかな?</p>'+keypad3('OK',true);
  return keypad3('OK');
}
function viewPlay(){
  var q=G.qs[G.i],h=topBar(),v;
  v=q.type==='meet'?viewMeet(q):q.type==='table'?viewTable(q):q.type==='find'?viewFind(q):q.type==='quest'?viewQuest(q):viewGraph(q);
  h+='<section class="panel">'+v+'</section>';
  if(G.fb)h+='<div class="fb hint '+(G.fb.ok?'good':'bad')+'" role="status">'+G.fb.msg+'</div>';
  h+='<section class="panel">'+controls(q)+'</section>';
  return h;
}
function viewResult(){
  var n=G.st.n,f=G.firstOK,st=calcStars();
  if(st>(save.stars[G.st.id]||0)){save.stars[G.st.id]=st;persist();}
  var title=G.over?'ハートがなくなった…':'ステージクリア!';
  var sub=G.over?'あと一歩。ヒントを思い出してもう一回!':'1回でせいかい '+f+' / '+n+' 問';
  return '<section class="panel result"><svg class="bob" width="70" height="78" viewBox="0 0 70 78" aria-hidden="true">'+robo(7.5,1.25,2)+'</svg>'
    +'<p class="big">'+title+'</p><p class="stars" style="font-size:34px;margin:0">'+starStr(st)+'</p><p>'+sub+'</p>'
    +'<p class="cap" style="color:var(--text);margin:6px 0">ワークでも <b>①1行に1ステップ</b> ・ <b>②答えの文まで</b> ・ <b>③もとに戻してたしかめる</b></p>'
    +'<p class="coins" style="justify-content:center;display:flex">'+coinSVG()+'コイン '+save.coins+'</p>'
    +'<div class="row"><button class="btn" data-act="start" data-id="'+G.st.id+'">もう一回</button><button class="btn plain" data-act="back">ステージへ</button></div></section>';
}
function render(){document.getElementById('app').innerHTML=screen==='title'?viewTitle():screen==='play'?viewPlay():viewResult();}

/* ---------- logic ---------- */
function onChoice(v){
  var q=G.qs[G.i];if(G.done)return;
  if(q.type==='meet'){onMeetChoice(v);return;}
  if(q.type==='find'&&G.phase==='form'){
    if(v==='adx'){G.phase='place';G.qn=null;step('まず <b>y = a/x</b>。これを書いてから代入しよう。');return;}
    if(miss('swap',v==='ax'?'それは<b>比例</b>の式。反比例は <b>y = a/x</b>(x × y = a)。':'x と a が逆。反比例は <b>y = a/x</b>。'))return;render();return;
  }
  if(q.type==='gdraw'){
    if(G.phase==='f1'){if(v==='hyp'){G.phase='f2';step('そう! 反比例のグラフは <b>双曲線</b>。');return;}if(miss('word','2本の曲線になっているね。反比例のグラフの名前は <b>双曲線</b>。'))return;render();return;}
    if(G.phase==='f2'){if(v==='no'){finish('x = 0 では y が決まらないから、原点は通らない。');return;}if(miss('word','グラフをよく見て。x = 0 のとき、0 で割ることはできないね。'))return;render();return;}
  }
  if(q.type==='quest'){
    var p=q.p;
    if(G.phase==='s0'){if(v==='ask0'){G.phase='s1';step('そう! 聞かれているのは <b>'+p.ask[0]+'</b>。答えの文も、これを答える文になるよ。');return;}if(miss('word','絵の <b>「?」</b> がついているところを見よう。問題文の最後の「〜は何?」も手がかり。'))return;render();return;}
    if(G.phase==='s1'){if(v==='ok'){G.phase='s2';step('OK! 次は <b>ことばの式</b>。');return;}if(miss('word','「x m の重さを y g」のように、<b>x と y の前にある言葉</b>を見よう。'))return;render();return;}
    if(G.phase==='s2'){if(q.wo[+v]===p.w){G.phase='s3';step('ことばの式ができた! これで表の y を計算しよう。');return;}if(miss('word','問題文の数で確かめよう。x = '+p.x0+' のとき y = '+p.y0+' になる式はどれ?'))return;render();return;}
    if(G.phase==='s3k'){if(v===p.k){G.phase='s4f';step((p.k==='prop'?'x が2倍で y も2倍 → 比例':'x が2倍で y は1/2 → 反比例')+'。次は式にしよう。');return;}if(miss('word','x が増えたとき、y は<b>同じ倍</b>で増えた? それとも<b>逆数の倍</b>で減った?'))return;render();return;}
    if(G.phase==='s4f'){if(v===p.k){G.phase='s4c';step('形OK! 次は a。');return;}if(miss('swap',p.k==='prop'?'比例だから y = ax。':'反比例だから y = a/x。'))return;render();return;}
  }
}
function onPlace(){
  var q=G.qs[G.i];if(!G.mark)return;var tx=G.mark.x,ty=G.mark.y;
  if(tx===0||ty===0){G.fb={ok:false,msg:'反比例のグラフは x 軸・y 軸の上を通らないよ。'};SFX.tap();render();return;}
  var on=tx*ty===q.a;
  if(q.type==='gdraw'&&G.phase==='pts'){
    if(on){if(!G.pts.some(function(p){return p.x===tx&&p.y===ty;}))G.pts.push({x:tx,y:ty,fill:tx>0?'#FFC928':'#4FA3F7'});G.mark=null;SFX.place();
      var pos=G.pts.filter(function(p){return p.x>0;}).length,neg=G.pts.length-pos;
      if(pos>=2&&neg>=2){G.phase='f1';step('点がそろった! なめらかにつなぐと…2本の曲線になった。');return;}
      G.fb={ok:true,msg:pos<2?'OK! x がプラスの点をもう少し。':neg<2?'OK! こんどは <b>x がマイナス</b>の点もさがそう。':'OK!'};render();return;}
    var st;if(tx*ty===-q.a)st=miss('sign','符号チェック! x × y が <b>'+M(q.a)+'</b> になる点。'+(q.a>0?'x がマイナスなら y もマイナス。':'x と y の符号はちがう。'));
    else st=miss('calc','x × y = '+M(q.a)+' になる点だよ。たとえば x = 1 なら y = '+M(q.a)+'、x = 2 なら y = '+M(q.a/2)+'。');
    if(st)return;G.mark=null;render();return;
  }
  if(q.type==='gread'&&G.phase==='tap'){
    if(on){G.pt={x:tx,y:ty};G.mark=null;G.phase='sign';step('点が見つかった! 反比例は <b>a = x × y</b>。符号から決めよう。');return;}
    if(miss('calc','その点は曲線の上にないよ。<b>曲線がマス目の交点をぴったり通るところ</b>をさがそう。'))return;G.mark=null;render();
  }
}
function onGridTap(svg,e){
  if(!G||(G.phase!=='pts'&&G.phase!=='tap'))return;
  var r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*300/r.width,sy=(e.clientY-r.top)*300/r.height;
  var x=Math.round((sx-C)/U),y=Math.round((C-sy)/U);if(Math.abs(x)>GR||Math.abs(y)>GR)return;
  G.mark={x:x,y:y};G.fb=null;SFX.tap();render();
}
function onChip(k){
  var q=G.qs[G.i];if(G.phase!=='place')return;
  var idx=G.boxes[0]===null?0:1;G.boxes[idx]=k;G.fb=null;SFX.place();
  if(G.boxes[0]&&G.boxes[1]){
    if(G.boxes[0]==='y'&&G.boxes[1]==='x'){if(q.x<0){G.phase='paren';render();return;}afterPlace();return;}
    G.boxes=[null,null];if(miss('swap','<b>xとyが入れかわってるよ!</b> y = a ÷ x だから、左の□には <b>y の値('+M(q.y)+')</b>、右の□には x の値。'))return;
  }
  render();
}
function afterPlace(){G.phase='sign';step('代入OK! y = a ÷ x だから、<b>a = y × x</b>(両方に x をかける)。まず <b>符号</b>。');}
function onParen(v){if(G.phase!=='paren')return;if(v==='wrap'){G.parenDone=true;SFX.place();afterPlace();return;}G.fb={ok:false,msg:'このままだと「÷ −」が並んで符号を見落としやすい。<b>マイナスの数は ( ) に入れよう。</b>'};SFX.tap();render();}
function onSign(v){
  var q=G.qs[G.i];if(G.phase!=='sign')return;var a=q.a,right=a>0?1:-1;
  if(v===right){G.sign=v;G.phase='num';step('符号OK! あとは数を入れよう。');return;}
  var xs,ys;if(q.type==='find'){xs=q.x;ys=q.y;}else{xs=G.pt.x;ys=G.pt.y;}
  if(miss('sign','<b>符号チェック!</b> ('+(ys<0?'−':'+')+') × ('+(xs<0?'−':'+')+') = ('+(right<0?'−':'+')+')。かけ算は 同じ符号なら+、ちがう符号なら−。'))return;render();
}
function onKey(k){
  if(!G||G.done)return;SFX.tap();
  if(k==='⌫'){if(G.input)G.input=G.input.slice(0,-1);else G.neg=false;}
  else if(k==='−')G.neg=!G.neg;
  else if(/^\d$/.test(k)&&G.input.length<6)G.input+=k;
  render();
}
function onOK(){
  var q=G.qs[G.i];if(G.done)return;
  if(!G.input){G.fb={ok:false,msg:'数を入れてからOKを押そう。'};render();return;}
  var v=(G.neg?-1:1)*parseInt(G.input,10),st;
  if(q.type==='table'){
    if(v===q.y){finish();return;}
    if(Math.abs(v)===Math.abs(q.y))st=miss('sign','<b>数は合ってる! 符号をチェック。</b> わり算も 同じ符号なら+、ちがう符号なら−。');
    else st=miss('calc','y = '+M(q.a)+' ÷ '+P(q.ask)+' を計算しよう。反比例は x × y がいつも '+M(q.a)+'。');
    if(st)return;G.input='';G.neg=false;render();return;
  }
  if(q.type==='find'){
    if(G.phase==='num'){if(Math.abs(v)===Math.abs(q.a)&&!G.neg){G.phase='check';G.input='';G.neg=false;step('a が出た! 最後に<b>たしかめ算</b>。a ÷ x が y になるかな?');return;}
      if(miss('calc',Math.abs(q.y)+' × '+Math.abs(q.x)+' を計算しよう。反比例は a = x × y(比例の y ÷ x とまちがえないで)。'))return;G.input='';render();return;}
    if(G.phase==='check'){if(v===q.y){finish('ロボのノートと同じ順番で、ワークにも書こう。');return;}
      if(Math.abs(v)===Math.abs(q.y))st=miss('sign','<b>符号チェック!</b> わり算も 同じ符号なら+、ちがう符号なら−。');else st=miss('calc',P(q.a)+' ÷ '+P(q.x)+' を計算しなおそう。');
      if(st)return;G.input='';G.neg=false;render();return;}
  }
  if(q.type==='gread'&&G.phase==='gcheck'){if(v===G.pt.y){finish();return;}if(miss(Math.abs(v)===Math.abs(G.pt.y)?'sign':'calc',Math.abs(v)===Math.abs(G.pt.y)?'符号をチェック! わり算も 同じ符号なら+、ちがう符号なら−。':P(q.a)+' ÷ '+P(G.pt.x)+' を計算しなおそう。'))return;G.input='';G.neg=false;render();return;}
  if(q.type==='gread'&&G.phase==='num'){if(Math.abs(v)===Math.abs(q.a)&&!G.neg){G.phase='gcheck';G.input='';G.neg=false;step('a が出た! <b>合言葉③</b>:もとに戻して たしかめよう。a ÷ x が点の y になるかな?');return;}if(miss('calc',Math.abs(G.pt.x)+' × '+Math.abs(G.pt.y)+' を計算しよう。'))return;G.input='';render();return;}
  if(q.type==='quest'){
    var p=q.p;
    if(G.phase==='s3'){if(v===tqy(p)){G.phase='s3k';G.input='';step('表ができた! x と y の変わり方を見よう。');return;}if(miss('calc','ことばの式 <b>'+p.w+'</b> に x = '+p.tx+' を入れて計算しよう。'))return;G.input='';render();return;}
    if(G.phase==='s4t'){var qc=qcheck(p);if(v===qc.val){G.phase='s5';G.input='';step(qc.goal+' と同じ! これで自信を持って <b>答えの文</b>が書ける。でもまだクリアじゃないよ。');return;}if(miss('calc',qc.expr+' を計算しなおそう。'))return;G.input='';render();return;}
    if(G.phase==='s4c'){if(v===p.c){G.phase='s4s';G.input='';step('式ができた! '+(p.known==='y'?'y':'x')+' に '+p.kv+' を入れて、1行ずつ解こう。');return;}if(miss('calc',p.k==='prop'?'比例の a は <b>y ÷ x</b>。'+p.y0+' ÷ '+p.x0+' は?':'反比例の a は <b>x × y</b>。'+p.x0+' × '+p.y0+' は?'))return;G.input='';render();return;}
    if(G.phase==='s4s'){if(v===p.ans){G.phase='s4t';G.input='';step('解けた! 答えの文の前に <b>合言葉③</b>:答えを問題に戻して たしかめよう。');return;}if(miss('calc','ノートの式を1行ずつ計算しよう:'+p.lines[p.lines.length-1]+'。'))return;G.input='';render();return;}
  }
}
function onQDone(){
  var q=G.qs[G.i],p=q.p;if(G.phase!=='s5')return;
  if(+G.qn===p.ans&&G.qu===p.unit){finish('答えの文まで書けて <b>クリア</b>! ワークでも最後の1行まで。');return;}
  var msg=+G.qn!==p.ans?'問題が聞いているのは何? 「'+p.pre+'…」に入るのは、<b>求めた答えの数</b>。':'<b>単位</b>をチェック! 何を聞かれているか(長さ? 時間? 個数?)で単位が決まるよ。';
  if(miss('word',msg))return;render();
}
function onNext(){var fin=G.i+1>=G.st.n;if(fin)logResult('クリア');G.i++;if(fin){screen='result';}else resetQ();render();window.scrollTo(0,0);if(fin)SFX.clear();else SFX.tap();}

document.getElementById('app').addEventListener('click',function(e){
  var svg=e.target.closest('svg.tapgrid');if(svg){onGridTap(svg,e);return;}
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var a=b.dataset.act;
  if(a==='start')startStage(b.dataset.id);
  else if(a==='back'){if(screen==='play'&&G&&(G.i>0||G.done))logResult('途中でやめた');screen='title';G=null;render();window.scrollTo(0,0);}
  else if(a==='mx')onMeetX(+b.dataset.v);
  else if(a==='trow'){G.rows[b.dataset.v]=!G.rows[b.dataset.v];SFX.tap();render();}
  else if(a==='wc')onChoice(b.dataset.v);
  else if(a==='chip')onChip(b.dataset.k);
  else if(a==='box'){if(G.phase==='place'){G.boxes[+b.dataset.i]=null;if(+b.dataset.i===0&&G.boxes[1]){G.boxes[0]=G.boxes[1];G.boxes[1]=null;}render();}}
  else if(a==='paren')onParen(b.dataset.v);
  else if(a==='sign')onSign(+b.dataset.v);
  else if(a==='place')onPlace();
  else if(a==='key')onKey(b.dataset.v);
  else if(a==='ok')onOK();
  else if(a==='qn'){G.qn=+b.dataset.v;SFX.tap();render();}
  else if(a==='qu'){G.qu=b.dataset.v;SFX.tap();render();}
  else if(a==='qdone')onQDone();
  else if(a==='next')onNext();
  else if(a==='sound'){save.sound=!save.sound;persist();render();if(save.sound)SFX.coin();}
});
document.addEventListener('keydown',function(e){
  if(screen!=='play'||!G)return;
  if(G.done&&e.key==='Enter'){onNext();return;}
  if(!document.querySelector('[data-act=ok]'))return;
  if(/^\d$/.test(e.key))onKey(e.key);else if(e.key==='Backspace')onKey('⌫');else if(e.key==='-')onKey('−');else if(e.key==='Enter')onOK();
});
render();
flush();
})();
</script>
</body>
